<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Sistema para registrar e acompanhar chamados de suporte de TI."
    />

    <title>Sistema de Chamados de TI</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <a class="skip-link" href="#conteudo-principal">Ir para o conteúdo principal</a>

    <!-- Cabeçalho da aplicação -->
    <header class="app-header">
      <p class="app-header__title">Sistema de Chamados de TI</p>
    </header>

    <div class="app-layout">
      <!-- Navegação principal -->
      <nav class="main-navigation" aria-label="Navegação principal">
        <ul class="main-navigation__list">
          <li>
            <a
              class="main-navigation__link main-navigation__link--active"
              href="#chamados"
              aria-current="page"
            >
              Chamados
            </a>
          </li>
          <li>
            <a class="main-navigation__link" href="#novo-chamado">Novo chamado</a>
          </li>
        </ul>
      </nav>

      <!-- Conteúdo principal -->
      <main id="conteudo-principal" class="main-content" tabindex="-1">
        <section id="chamados" class="content-section" aria-labelledby="page-title">
          <h1 id="page-title">Chamados</h1>
          <p class="content-section__description">
            Lista de chamados de suporte de TI.
          </p>

          <!-- Estrutura da lista de chamados -->
          <div
            class="table-container"
            role="region"
            aria-labelledby="table-title"
            tabindex="0"
          >
            <table class="tickets-table">
              <caption id="table-title" class="visually-hidden">
                Chamados cadastrados
              </caption>
              <thead>
                <tr>
                  <th scope="col">Número</th>
                  <th scope="col">Título</th>
                  <th scope="col">Prioridade</th>
                  <th scope="col">Status</th>
                </tr>
              </thead>
              <tbody id="lista-chamados">
                <tr>
                  <td class="tickets-table__empty" colspan="4">
                    Nenhum chamado cadastrado.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <!-- Formulário de cadastro -->
        <section
          id="novo-chamado"
          class="content-section"
          aria-labelledby="form-title"
        >
          <h2 id="form-title">Novo chamado</h2>
          <p class="content-section__description">
            Informe os dados da solicitação de suporte.
          </p>

          <form id="form-chamado" class="ticket-form">
            <div class="form-field form-field--full">
              <label for="titulo">Título</label>
              <input id="titulo" name="titulo" type="text" />
            </div>

            <div class="form-field">
              <label for="solicitante">Solicitante</label>
              <input id="solicitante" name="solicitante" type="text" />
            </div>

            <div class="form-field">
              <label for="categoria">Categoria</label>
              <input id="categoria" name="categoria" type="text" />
            </div>

            <div class="form-field">
              <label for="prioridade">Prioridade</label>
              <select id="prioridade" name="prioridade">
                <option value="">Selecione</option>
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
              </select>
            </div>

            <div class="form-field">
              <label for="prazo">Prazo</label>
              <input id="prazo" name="prazo" type="date" />
            </div>

            <div class="form-field form-field--full">
              <label for="descricao">Descrição</label>
              <textarea id="descricao" name="descricao" rows="5"></textarea>
            </div>

            <div class="ticket-form__actions form-field--full">
              <button class="primary-button" type="submit">Salvar chamado</button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
